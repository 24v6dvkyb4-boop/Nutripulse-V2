  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030b19;font-family:Arial,Helvetica,sans-serif}
    body{display:flex;justify-content:center;align-items:flex-start}
    .page{position:relative;width:min(100%,1672px);line-height:0;isolation:isolate}
    .maquette{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .zone{position:absolute;display:block;z-index:2;border:0;border-radius:14px;background:transparent;cursor:pointer;text-decoration:none;line-height:normal;outline:none}
    .zone:hover{background:rgba(255,145,20,.10);box-shadow:inset 0 0 0 2px rgba(255,160,35,.65)}
    .zone:focus-visible{background:rgba(255,145,20,.14);box-shadow:inset 0 0 0 3px #ffd36a,0 0 0 3px #06142b}
    .zone span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:7px 10px;border-radius:8px;background:#07152beF;color:#fff;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none}
    .zone:focus-visible span{opacity:1}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .hint{position:fixed;right:12px;bottom:12px;z-index:5;padding:8px 12px;border:1px solid #35527e;border-radius:20px;background:#07152be8;color:#dceaff;font-size:12px;line-height:1.3;opacity:.85}
    @media(max-width:650px){.page{width:100%;min-width:0}.hint{font-size:10px;right:6px;bottom:6px;padding:6px 8px}}
  </style>
</head>
